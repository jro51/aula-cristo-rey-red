# Puerto del servidor web
server.port=8080

# Configuracion de la Base de Datos MySQL Compartida (Aiven Cloud) limpia
spring.datasource.url=jdbc:mysql://localhost:3306/aula_virtual_cristo_rey?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuracion de Hibernate (Manejo automatico de tablas)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Desactivar cache de plantillas Thymeleaf (solo para desarrollo)
spring.thymeleaf.cache=false

# Configuracion del Servidor LDAP (Active Directory de Windows Server 2022)
spring.ldap.urls=ldap://192.168.1.15:389
spring.ldap.base=DC=cristorey,DC=local

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.ldap=DEBUG