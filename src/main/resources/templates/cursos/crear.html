<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear Curso | Aula Cristo Rey</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
  </head>
  <body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

      <!-- Contenedor principal -->
      <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10">
        <div class="max-w-2xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-200">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Crear Nuevo Curso</h1>
            <p class="text-sm text-gray-500">Asigna un docente, grado y sección a un nuevo curso.</p>
          </div>

          <form th:action="@{/cursos/guardar}" th:object="${curso}" method="post" class="space-y-5">
            <div>
              <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre del Curso</label>
              <input type="text" id="nombre" th:field="*{nombre}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Ej. Matemáticas" />
            </div>

            <div>
              <label for="docente" class="block text-sm font-medium text-gray-700 mb-1">Docente Asignado</label>
              <select id="docente" th:field="*{docente.id}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                <option value="">-- Selecciona un Docente --</option>
                <option th:each="d : ${docentes}" th:value="${d.id}" th:text="${d.nombres + ' ' + d.apellidos}"></option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
              <div>
                <label for="grado" class="block text-sm font-medium text-gray-700 mb-1">Grado</label>
                <select id="grado" th:field="*{grado.id}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                  <option value="">-- Selecciona un Grado --</option>
                  <option th:each="g : ${grados}" th:value="${g.id}" th:text="${g.nombre}"></option>
                </select>
              </div>

              <div>
                <label for="seccion" class="block text-sm font-medium text-gray-700 mb-1">Sección</label>
                <select id="seccion" th:field="*{seccion.id}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                  <option value="">-- Selecciona una Sección --</option>
                  <option th:each="s : ${secciones}" th:value="${s.id}" th:text="${s.nombre}"></option>
                </select>
              </div>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
              <a th:href="@{/cursos}" class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium transition">Cancelar</a>
              <button type="submit" class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-medium transition">
                Guardar Curso
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
