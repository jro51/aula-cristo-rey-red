<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Listado de Apoderados | Aula Virtual</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
    <link href="/css/style.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 text-gray-800" x-data="{ sidebarToggle: false, darkMode: false, menuToggle: false }">
<div class="flex h-screen overflow-hidden">
    <div th:replace="~{partials/sidebar :: sidebar}"></div>
    <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
        <div th:replace="~{partials/overlay :: overlay}"></div>
        <div th:replace="~{partials/header :: header}"></div>

        <main class="space-y-6 p-6 sm:p-10">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Apoderados registrados</h1>
                    <p class="mt-1 text-sm text-gray-500">Consulta y gestiona los apoderados registrados.</p>
                </div>
                <div class="flex flex-col gap-3 sm:flex-row">
                    <a th:href="@{/apoderados/nuevo}" class="rounded-lg bg-blue-600 px-5 py-2.5 text-center text-sm font-medium text-white hover:bg-blue-700">Registrar apoderado</a>
                </div>
            </div>

            <section class="overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm">
                <!-- Contenedor estático con scroll -->
                <div class="overflow-x-auto">
                    <table id="tabla-apoderados" th:fragment="tablaApoderados" class="w-full min-w-[950px]">
                        <thead class="bg-gray-50">
                        <tr>
                            <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">DNI</th>
                            <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Apoderado</th>
                            <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Parentesco</th>
                            <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Teléfono</th>
                            <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-gray-500">Estado</th>
                            <th class="px-5 py-3 text-right text-xs font-semibold uppercase tracking-wide text-gray-500">Acciones</th>
                        </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">
                        <tr th:each="apoderado : ${apoderados}" class="hover:bg-gray-50">
                            <td class="whitespace-nowrap px-5 py-4 text-sm font-medium text-gray-900" th:text="${apoderado.dni}"></td>
                            <td class="px-5 py-4">
                                <p class="text-sm font-medium text-gray-800" th:text="${apoderado.nombres + ' ' + apoderado.apellidos}"></p>
                                <p class="mt-1 text-xs text-gray-500" th:text="${apoderado.email}"></p>
                            </td>
                            <td class="whitespace-nowrap px-5 py-4 text-sm text-gray-600" th:text="${apoderado.parentesco}"></td>
                            <td class="whitespace-nowrap px-5 py-4 text-sm text-gray-600" th:text="${apoderado.telefono}"></td>
                            <td class="px-5 py-4">
                                <span th:if="${apoderado.estado}" class="rounded-full bg-green-100 px-3 py-1 text-xs font-semibold text-green-700">Activo</span>
                                <span th:unless="${apoderado.estado}" class="rounded-full bg-red-100 px-3 py-1 text-xs font-semibold text-red-700">Inactivo</span>
                            </td>
                            <td class="whitespace-nowrap px-5 py-4 text-right">
                                <a th:href="@{/apoderados/editar/{id}(id=${apoderado.id})}" class="inline-block rounded-lg border border-gray-300 bg-white px-3 py-2 text-xs font-medium text-gray-700 hover:bg-gray-100">Editar</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(apoderados)}">
                            <td colspan="6" class="px-5 py-12 text-center">
                                <p class="text-sm font-medium text-gray-700">No se encontraron apoderados.</p>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
</div>

<script>
    setInterval(function () {
        const activeElement = document.activeElement;
        const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

        if (!isInteracting) {
            fetch('/apoderados/parcial')
                .then(res => res.text())
                .then(html => {
                    if (html.trim() !== '') {
                        const tabla = document.getElementById('tabla-apoderados');
                        if (tabla) {
                            const scrollContainer = tabla.closest('.overflow-x-auto');
                            const scrollPos = scrollContainer ? scrollContainer.scrollLeft : 0;

                            tabla.outerHTML = html;

                            const nuevaTabla = document.getElementById('tabla-apoderados');
                            const nuevoContainer = nuevaTabla ? nuevaTabla.closest('.overflow-x-auto') : scrollContainer;
                            if (nuevoContainer) {
                                nuevoContainer.scrollLeft = scrollPos;
                            }
                        }
                    }
                })
                .catch(err => console.error('Error al actualizar apoderados en tiempo real:', err));
        }
    }, 3000);
</script>
</body>
</html>
