<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Cursos | Aula Virtual Cristo Rey</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-100">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <div th:replace="~{partials/sidebar :: sidebar}"></div>

  <!-- Contenido principal -->
  <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-10">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Mis Cursos</h1>

    <!-- CONTENEDOR CON FRAGMENTO PARA TIEMPO REAL -->
    <div id="contenedorMisCursos" th:fragment="misCursosContainer">
      <div th:if="${cursos != null and !#lists.isEmpty(cursos)}">
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div th:each="curso : ${cursos}"
               class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 hover:shadow-md transition">
            <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-medium text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full"
                          th:text="${curso.codigo}">COD</span>
              <span class="text-xs text-gray-400"
                    th:text="${curso.horasSemanales + ' hrs/sem'}">0 hrs</span>
            </div>
            <p class="text-base font-semibold text-gray-800" th:text="${curso.nombre}">Curso</p>
            <p class="text-xs text-gray-500 mt-1 line-clamp-2" th:text="${curso.descripcion}">—</p>
            <!-- Botón directo a mis tareas filtrado por curso -->
            <a th:href="@{/tareas/mis-tareas(cursoId=${curso.id})}"
               class="mt-3 inline-block text-xs text-blue-600 hover:text-blue-800 font-medium">
              Ver tareas →
            </a>
          </div>
        </div>
      </div>

      <!-- Sin cursos encontrados -->
      <div th:if="${cursos == null or #lists.isEmpty(cursos)}"
           class="mt-4 p-4 bg-yellow-50 border border-yellow-200 text-yellow-800 rounded-lg text-sm">
        No tienes cursos asignados en este momento. Consulta con tu administrador.
      </div>
    </div>

  </div>
</div>

<script>
  // Actualización asíncrona inteligente cada 3 segundos en segundo plano
  setInterval(function () {
      const activeElement = document.activeElement;
      const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

      if (!isInteracting) {
          fetch('/asignaciones-docente/mis-cursos-parcial') // O la ruta de tu controlador para mis cursos parciales
              .then(res => res.text())
              .then(html => {
                  if (html.trim() !== '') {
                      const container = document.getElementById('contenedorMisCursos');
                      if (container) {
                            // 1. Guardar la posición actual del scroll horizontal
                            const scrollPos = container.scrollLeft;

                            // 2. Actualizar el contenido HTML
                            container.innerHTML = html;

                            // 3. Restaurar la posición del scroll para que no se mueva
                            container.scrollLeft = scrollPos;
                        }
                  }
              })
              .catch(err => console.error('Error al actualizar mis cursos en tiempo real:', err));
      }
  }, 3000);
</script>
</body>
</html>
