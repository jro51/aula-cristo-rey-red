<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Actualizar Matrícula | Aula Virtual</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-50 text-gray-800" x-data="{ sidebarToggle: false, darkMode: false, menuToggle: false }">
    <div class="flex h-screen overflow-hidden">
        <div th:replace="~{partials/sidebar :: sidebar}"></div>
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <div th:replace="~{partials/header :: header}"></div>

            <main class="p-6 sm:p-10 space-y-6">
                <div class="flex flex-col gap-y-4 max-w-4xl mx-auto">
                    <div>
                        <h1 class="text-2xl font-bold text-gray-800">Actualizar Datos de Matrícula</h1>
                        <p class="text-sm text-gray-500 mt-1">Revisa y actualiza la información de contacto antes de continuar el proceso.</p>
                    </div>
                    
                    <div th:if="${mensajeExito}" class="p-4 text-sm text-green-800 rounded-lg bg-green-50 border border-green-200" th:text="${mensajeExito}"></div>
                    <div th:if="${mensajeError}" class="p-4 text-sm text-red-800 rounded-lg bg-red-50 border border-red-200" th:text="${mensajeError}"></div>

                    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
                        <!-- Cabecera inmutable de la solicitud -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8 p-5 bg-blue-50/50 rounded-lg border border-blue-100">
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Código Solicitud</label>
                                <p class="text-lg font-bold text-blue-700" th:text="${solicitudInfo.codigoSolicitud}"></p>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Estado</label>
                                <p class="mt-1"><span class="px-2.5 py-1 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800" th:text="${solicitudInfo.estado}"></span></p>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-gray-500 uppercase">Fecha Registro</label>
                                <p class="text-sm font-medium text-gray-700" th:text="${#temporals.format(solicitudInfo.fechaRegistro, 'dd/MM/yyyy')}"></p>
                            </div>
                        </div>

                        <!-- Formulario de actualización (Mapeado al DTO) -->
                        <form th:action="@{/prematriculas/editar/{id}(id=${solicitudInfo.id})}" th:object="${matriculaDto}" method="post">
                            
                            <h3 class="text-lg font-semibold border-b pb-2 mb-4">1. Datos del Estudiante</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
                                <div class="sm:col-span-2">
                                    <label class="block text-sm text-gray-500">Nombres y Apellidos (Legal - No editable)</label>
                                    <input type="text" readonly th:value="${solicitudInfo.estudiante.nombres + ' ' + solicitudInfo.estudiante.apellidos}" class="w-full rounded-lg border border-gray-200 bg-gray-100 px-4 py-2 mt-1 text-gray-600" />
                                </div>
                                
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Año Académico</label>
                                    <select th:field="*{anioAcademico}" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
                                        <option value="2026">2026</option>
                                        <option value="2027">2027</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Grado a matricular</label>
                                    <select th:field="*{estudianteGrado}" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
                                        <option value="1ro Secundaria">1ro Secundaria</option>
                                        <option value="2do Secundaria">2do Secundaria</option>
                                        <option value="3ro Secundaria">3ro Secundaria</option>
                                        <option value="4to Secundaria">4to Secundaria</option>
                                        <option value="5to Secundaria">5to Secundaria</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Correo Electrónico</label>
                                    <input type="email" th:field="*{estudianteCorreo}" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none" />
                                </div>
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Teléfono / Celular</label>
                                    <input type="text" th:field="*{estudianteTelefono}" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none" />
                                </div>
                            </div>

                            <h3 class="text-lg font-semibold border-b pb-2 mb-4">2. Datos del Apoderado (Responsable)</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">
                                <div>
                                    <label class="block text-sm text-gray-500">Nombres y Apellidos (Legal)</label>
                                    <input type="text" readonly th:value="${solicitudInfo.apoderado.nombres + ' ' + solicitudInfo.apoderado.apellidos}" class="w-full rounded-lg border border-gray-200 bg-gray-100 px-4 py-2 mt-1 text-gray-600" />
                                </div>
                                <div>
                                    <label class="block text-sm text-gray-500">DNI</label>
                                    <input type="text" readonly th:value="${solicitudInfo.apoderado.dni}" class="w-full rounded-lg border border-gray-200 bg-gray-100 px-4 py-2 mt-1 text-gray-600" />
                                </div>
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Correo Electrónico <span class="text-red-500">*</span></label>
                                    <input type="email" th:field="*{apoderadoCorreo}" required class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none" />
                                </div>
                                <div>
                                    <label class="mb-1 block text-sm font-medium text-gray-700">Celular de Emergencia</label>
                                    <input type="text" th:field="*{apoderadoTelefono}" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 focus:outline-none" />
                                </div>
                            </div>

                            <div class="flex justify-end gap-3 pt-5 border-t border-gray-100">
                                <a href="/prematriculas" class="px-5 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Volver</a>
                                <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors">Guardar Actualización</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
</body>
</html>
