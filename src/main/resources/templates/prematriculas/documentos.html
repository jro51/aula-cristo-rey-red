<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adjuntar Documentos | Aula Virtual</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-50 text-gray-800" x-data="{ sidebarToggle: false, menuToggle: false, tipoSeleccionado: '' }">
    <div class="flex h-screen overflow-hidden">
        <div th:replace="~{partials/sidebar :: sidebar}"></div>
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <div th:replace="~{partials/header :: header}"></div>

            <main class="p-6 sm:p-10 space-y-6 max-w-5xl mx-auto w-full">
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Adjuntar Documentos Requeridos</h1>
                    <p class="text-sm text-gray-500 mt-1">Solicitud: <span class="font-bold text-blue-600" th:text="${solicitud.codigoSolicitud}"></span> - <span th:text="${solicitud.estudiante.nombres + ' ' + solicitud.estudiante.apellidos}"></span></p>
                </div>
                
                <div th:if="${mensajeExito}" class="p-4 text-sm text-green-800 bg-green-50 rounded-lg border border-green-200" th:text="${mensajeExito}"></div>
                <div th:if="${mensajeError}" class="p-4 text-sm text-red-800 bg-red-50 rounded-lg border border-red-200" th:text="${mensajeError}"></div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    
                    <!-- Formulario de Subida -->
                    <div class="lg:col-span-1">
                        <div class="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                            <h3 class="text-lg font-semibold mb-4 border-b pb-2">Nuevo Documento</h3>
                            <form th:action="@{/prematriculas/{id}/documentos(id=${solicitud.id})}" method="post" enctype="multipart/form-data" class="space-y-4">
                                
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Documento</label>
                                    <select name="tipoDocumento" required x-model="tipoSeleccionado" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 outline-none">
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option th:each="tipo : ${tiposSugeridos}" th:value="${tipo}" th:text="${tipo}"></option>
                                    </select>
                                </div>

                                <div x-show="tipoSeleccionado === 'Otro'" x-cloak>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Especifique el tipo</label>
                                    <input type="text" name="tipoDocumentoOtro" :required="tipoSeleccionado === 'Otro'" placeholder="Ej: Certificado Médico" class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:border-blue-500 outline-none" />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Archivo (PDF, JPG, PNG)</label>
                                    <input type="file" name="archivo" required accept=".pdf,.jpg,.jpeg,.png" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-lg p-1" />
                                </div>

                                <button type="submit" class="w-full mt-4 bg-blue-600 text-white font-medium py-2.5 rounded-lg hover:bg-blue-700 transition">Adjuntar Archivo</button>
                            </form>
                        </div>
                    </div>

                    <!-- Lista de Documentos Cargados (AVCR-177) -->
                    <div class="lg:col-span-2">
                        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                            <table class="min-w-full divide-y divide-gray-200">
                                <thead class="bg-gray-50">
                                    <tr>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Documento</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Archivo Físico</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Estado</th>
                                        <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase">Fecha</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    <tr th:each="doc : ${documentos}" class="hover:bg-gray-50">
                                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${doc.tipoDocumento}"></td>
                                        <td class="px-6 py-4 text-sm text-gray-500 truncate max-w-[200px]" th:text="${doc.nombreArchivoOriginal}"></td>
                                        <td class="px-6 py-4 whitespace-nowrap">
                                            <span class="px-2.5 py-1 text-xs font-medium bg-green-100 text-green-800 rounded-full">Cargado</span>
                                        </td>
                                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(doc.fechaSubida, 'dd/MM HH:mm')}"></td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(documentos)}">
                                        <td colspan="4" class="px-6 py-10 text-center text-gray-500">
                                            Aún no se han adjuntado documentos a esta solicitud.<br>
                                            <span class="text-xs text-gray-400">Estado: Pendiente de carga</span>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="mt-4 flex justify-end">
                            <a href="/prematriculas/lista" class="text-sm text-blue-600 hover:underline">← Volver al listado</a>
                        </div>
                    </div>

                </div>
            </main>
        </div>
    </div>
</body>
</html>
