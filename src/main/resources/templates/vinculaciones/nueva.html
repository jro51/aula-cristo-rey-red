<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vincular Estudiante | Aula Virtual</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-50 text-gray-800" x-data="{ sidebarToggle: false, darkMode: false, menuToggle: false }">
    <div class="flex h-screen overflow-hidden">
        <div th:replace="~{partials/sidebar :: sidebar}"></div>
        <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
            <div th:replace="~{partials/overlay :: overlay}"></div>
            <div th:replace="~{partials/header :: header}"></div>

            <main class="p-6 sm:p-10 space-y-6">
                <div class="flex flex-col gap-y-4">
                    <h1 class="text-2xl font-bold">Vincular Estudiante con Apoderado</h1>
                    
                    <div th:if="${mensajeExito}" class="p-4 mb-4 text-sm text-green-800 rounded-lg bg-green-50" role="alert">
                        <span class="font-medium" th:text="${mensajeExito}"></span>
                    </div>
                    <div th:if="${errorVinculo}" class="p-4 mb-4 text-sm text-red-800 rounded-lg bg-red-50" role="alert">
                        <span class="font-medium" th:text="${errorVinculo}"></span>
                    </div>

                    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm max-w-2xl">
                        <form th:action="@{/vinculaciones/nueva}" method="post">
                            <div class="space-y-6 mb-6">
                                
                                <!-- AVCR-119: Selector de Estudiante -->
                                <div>
                                    <label class="mb-2 block text-sm font-medium text-gray-700">Seleccionar Estudiante <span class="text-red-500">*</span></label>
                                    <select name="estudianteId" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 bg-white focus:border-blue-500 focus:outline-none">
                                        <option value="" disabled selected>Elija un estudiante...</option>
                                        <option th:each="est : ${estudiantes}" 
                                                th:value="${est.id}" 
                                                th:text="${est.nombres + ' ' + est.apellidos + ' - DNI: ' + est.dni + (est.apoderado != null ? ' (Ya tiene apoderado)' : '')}"></option>
                                    </select>
                                </div>

                                <!-- AVCR-120: Selector de Apoderado -->
                                <div>
                                    <label class="mb-2 block text-sm font-medium text-gray-700">Seleccionar Apoderado <span class="text-red-500">*</span></label>
                                    <select name="apoderadoId" required class="w-full rounded-lg border border-gray-300 px-4 py-2.5 bg-white focus:border-blue-500 focus:outline-none">
                                        <option value="" disabled selected>Elija un apoderado...</option>
                                        <option th:each="apo : ${apoderados}" 
                                                th:value="${apo.id}" 
                                                th:text="${apo.nombres + ' ' + apo.apellidos + ' - DNI: ' + apo.dni}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="flex justify-end pt-5 border-t border-gray-100">
                                <button type="submit" class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white hover:bg-blue-700">Vincular</button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>

</body>
</html>
