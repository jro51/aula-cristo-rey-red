<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Usuario | Aula Cristo Rey</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

      <!-- Contenedor principal -->
      <div
        class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10"
      >
        <div
          class="max-w-2xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-200"
        >
          <div class="mb-6">
            <h1
              class="text-2xl font-bold text-gray-800"
              th:text="${usuario.idUsuario == null ? 'Registrar Usuario' : 'Editar Usuario'}"
            ></h1>
            <p class="text-sm text-gray-500">
              Completa los datos de la cuenta de usuario
            </p>
          </div>

          <form
            th:action="${usuario.idUsuario == null} ? @{/usuarios/guardar} : @{/usuarios/actualizar/{id}(id=${usuario.idUsuario})}"
            th:object="${usuario}"
            method="post"
            class="space-y-5"
          >
            <input type="hidden" th:field="*{idUsuario}" />

            <div>
              <label
                for="username"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Nombre de Usuario</label
              >
              <input
                type="text"
                id="username"
                th:field="*{username}"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="Ej. jperez"
              />
            </div>

            <div>
              <label
                for="password"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Contraseña</label
              >
              <input
                type="password"
                id="password"
                th:field="*{password}"
                th:required="${usuario.idUsuario == null}"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
                placeholder="••••••••"
              />
            </div>

            <div>
              <label
                for="rol"
                class="block text-sm font-medium text-gray-700 mb-1"
                >Rol asignado</label
              >
              <select
                id="rol"
                th:field="*{rol.id}"
                required
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
              >
                <option value="">-- Selecciona un Rol --</option>
                <option
                  th:each="r : ${roles}"
                  th:value="${r.id}"
                  th:text="${r.nombre}"
                ></option>
              </select>
            </div>

            <div class="flex items-center space-x-2 pt-2">
              <input
                type="checkbox"
                id="estado"
                th:field="*{estado}"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded"
              />
              <label for="estado" class="text-sm font-medium text-gray-700"
                >Cuenta Activa</label
              >
            </div>

            <div
              class="flex justify-end space-x-3 pt-4 border-t border-gray-100"
            >
              <a
                th:href="@{/usuarios}"
                class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium transition"
                >Cancelar</a
              >
              <button
                type="submit"
                class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-medium transition"
              >
                Guardar Usuario
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
