<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestión de Usuarios | Aula Cristo Rey</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-100">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar compartido -->
  <aside th:replace="~{/partials/sidebar :: sidebar}"></aside>

  <!-- Contenedor de contenido -->
  <div
          class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10"
  >
    <div class="max-w-6xl mx-auto w-full">
      <div
              class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4"
      >
        <div>
          <h1 class="text-2xl font-bold text-gray-800">
            Gestión de Usuarios
          </h1>
          <p class="text-sm text-gray-500">
            Módulo de control de cuentas y accesos del sistema
          </p>
        </div>
        <a
                th:href="@{/usuarios/nuevo}"
                class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-lg shadow transition"
        >
          + Registrar Usuario
        </a>
      </div>

      <!-- Mensajes informativos -->
      <div
              th:if="${mensajeExito}"
              class="mb-4 p-4 rounded-lg bg-green-50 border border-green-200 text-green-700"
              th:text="${mensajeExito}"
      ></div>
      <div
              th:if="${mensajeError}"
              class="mb-4 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700"
              th:text="${mensajeError}"
      ></div>

      <!-- Tabla de usuarios con Contenedor Parcial para Tiempo Real -->
      <div
              id="tablaUsuariosContainer"
              th:fragment="tablaUsuariosContainer"
              class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm"
      >
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead
                    class="bg-gray-50 text-gray-700 uppercase font-semibold text-xs border-b border-gray-200"
            >
            <tr>
              <th class="p-4">ID</th>
              <th class="p-4">Nombre de Usuario</th>
              <th class="p-4">Estado</th>
              <th class="p-4 text-center">Acciones</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
            <tr th:each="user : ${usuarios}" class="hover:bg-gray-50">
              <td
                      class="p-4 font-medium text-gray-600"
                      th:text="${user.idUsuario}"
              ></td>
              <td
                      class="p-4 font-semibold text-gray-900"
                      th:text="${user.username}"
              ></td>
              <td class="p-4">
                      <span
                              th:if="${user.estado}"
                              class="px-2.5 py-1 text-xs font-semibold text-green-800 bg-green-100 rounded-full"
                      >Activo</span
                      >
                <span
                        th:unless="${user.estado}"
                        class="px-2.5 py-1 text-xs font-semibold text-red-800 bg-red-100 rounded-full"
                >Inactivo</span
                >
              </td>
              <td class="p-4 text-center space-x-3">
                <a
                        th:href="@{/usuarios/editar/{id}(id=${user.idUsuario})}"
                        class="text-blue-600 hover:underline font-medium"
                >Editar</a
                >
                <a
                        th:if="${user.estado}"
                        th:href="@{/usuarios/estado/{id}/false(id=${user.idUsuario})}"
                        class="text-red-600 hover:underline font-medium"
                >Desactivar</a
                >
                <a
                        th:unless="${user.estado}"
                        th:href="@{/usuarios/estado/{id}/true(id=${user.idUsuario})}"
                        class="text-green-600 hover:underline font-medium"
                >Activar</a
                >
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(usuarios)}">
              <td colspan="4" class="p-6 text-center text-gray-500">
                No hay usuarios registrados en el sistema.
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Script de sincronización asíncrona inteligente -->
<script>
  setInterval(function () {
      const activeElement = document.activeElement;
      const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

      if (!isInteracting) {
          fetch('/usuarios/parcial')
              .then(res => res.text())
              .then(html => {
                  if (html.trim() !== '') {
                      const container = document.getElementById('tablaUsuariosContainer');
                      if (container) {
                            const scrollContainer = container.querySelector('.overflow-x-auto');
                            // 1. Guardar la posición actual del scroll horizontal dentro de la tabla
                            const scrollPos = scrollContainer ? scrollContainer.scrollLeft : 0;

                            // 2. Actualizar el contenido HTML del contenedor principal
                            container.innerHTML = html;

                            // 3. Restaurar la posición del scroll en la nueva tabla generada
                            const newScrollContainer = container.querySelector('.overflow-x-auto');
                            if (newScrollContainer) {
                                newScrollContainer.scrollLeft = scrollPos;
                            }
                        }
                  }
              })
              .catch(err => console.error('Error al actualizar usuarios en tiempo real:', err));
      }
  }, 3000);
</script>
</body>
</html>
