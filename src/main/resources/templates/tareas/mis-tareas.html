<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Tareas | Aula Cristo Rey</title>
  <meta name="description" content="Consulta tus tareas y materiales publicados por curso." />
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
<div class="flex h-screen overflow-hidden">

  <!-- Sidebar -->
  <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

  <!-- Contenedor principal -->
  <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10">

    <!-- Encabezado -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-6 gap-3">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Mis Tareas</h1>
        <p class="text-sm text-gray-500">
          <span th:if="${cursoInfo != null}" th:text="${'Tareas de ' + cursoInfo.nombre}"></span>
          <span th:if="${cursoInfo == null}">Consulta las tareas publicadas de tus cursos</span>
          <span th:if="${estudiante != null}"
                th:text="' — ' + ${estudiante.nombres} + ' ' + ${estudiante.apellidos}"></span>
        </p>
      </div>
    </div>

    <!-- Mensaje de error -->
    <div th:if="${error != null}"
         class="mb-4 p-4 bg-yellow-50 border border-yellow-300 text-yellow-800 rounded-lg text-sm"
         th:text="${error}">
    </div>

    <!-- CONTENEDOR PARCIAL PARA TIEMPO REAL -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden overflow-x-auto">
      <div id="listaTareasContainer" th:fragment="listaTareasContainer">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Tarea
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Curso
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Fecha Límite
            </th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
              Estado
            </th>
          </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">

          <tr th:each="tarea : ${tareas}" class="hover:bg-gray-50 transition">
            <td class="px-6 py-4">
              <div class="text-sm font-semibold text-gray-900" th:text="${tarea.titulo}">Título</div>
              <div class="text-xs text-gray-500 mt-1 line-clamp-2 max-w-xs"
                   th:text="${tarea.descripcion}">Descripción...</div>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800"
                          th:text="${tarea.curso.nombre}">Curso</span>
              <div class="text-xs text-gray-400 mt-1"
                   th:text="${tarea.curso.grado != null ? tarea.curso.grado.nombre : ''}">Grado</div>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-700"
                   th:text="${tarea.fechaLimite != null ? #temporals.format(tarea.fechaLimite, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}">
                —
              </div>
            </td>

            <td class="px-6 py-4 whitespace-nowrap">
                    <span th:switch="${tarea.estado}">
                      <span th:case="'Pendiente'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                        Pendiente
                      </span>
                      <span th:case="'Próxima a vencer'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-yellow-100 text-yellow-800">
                        ⚠ Próxima a vencer
                      </span>
                      <span th:case="'Vencida'"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">
                        Vencida
                      </span>
                      <span th:case="*"
                            class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600"
                            th:text="${tarea.estado}">—</span>
                    </span>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(tareas)}">
            <td colspan="4" class="px-6 py-10 text-center text-gray-400">
              <div class="flex flex-col items-center gap-2">
                <svg class="w-10 h-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <p class="text-sm">No hay tareas publicadas para tus cursos en este momento.</p>
              </div>
            </td>
          </tr>

          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  setInterval(function () {
      const activeElement = document.activeElement;
      const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

      if (!isInteracting) {
          const urlParams = window.location.search;
          fetch('/tareas/mis-tareas/parcial' + urlParams)
              .then(res => res.text())
              .then(html => {
                  if (html.trim() !== '') {
                      const container = document.getElementById('listaTareasContainer');
                      if (container) {
                            const scrollContainer = container.closest('.overflow-x-auto');
                            // 1. Guardar la posición actual del scroll horizontal
                            const scrollPos = scrollContainer ? scrollContainer.scrollLeft : 0;

                            // 2. Actualizar el contenido HTML
                            container.innerHTML = html;

                            // 3. Restaurar la posición del scroll para que no se mueva
                            if (scrollContainer) {
                                scrollContainer.scrollLeft = scrollPos;
                            }
                        }
                  }
              })
              .catch(err => console.error('Error al actualizar mis tareas:', err));
      }
  }, 3000);
</script>
</body>
</html>
