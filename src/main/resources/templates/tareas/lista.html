<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas | Aula Cristo Rey</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

  <!-- Contenedor principal -->
  <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10">

    <div class="flex justify-between items-center mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-800">Tareas Publicadas</h1>
        <p class="text-sm text-gray-500">Gestiona las actividades asignadas a los cursos.</p>
      </div>
    </div>

    <!-- CONTENEDOR PARCIAL PARA TIEMPO REAL -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden overflow-x-auto">
      <div id="tablaTareasPublicadasContainer" th:fragment="tablaTareasPublicadasContainer">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Curso</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Límite</th>
          </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
          <tr th:each="tarea : ${tareas}">
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm font-medium text-gray-900" th:text="${tarea.titulo}">Título Tarea</div>
              <div class="text-sm text-gray-500 truncate w-64" th:text="${tarea.descripcion}">Descripción...</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
              <div class="text-sm text-gray-900" th:text="${tarea.curso.nombre + ' - ' + (tarea.curso.grado != null ? tarea.curso.grado.nombre : '') + ' - ' + (tarea.curso.seccion != null ? tarea.curso.seccion.nombre : '')}">Nombre del Curso</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${#temporals.format(tarea.fechaLimite, 'dd/MM/yyyy HH:mm')}">
              10/10/2026
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tareas)}">
            <td colspan="3" class="px-6 py-10 text-center text-gray-500">
              No hay tareas publicadas actualmente.
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Script de sincronización asíncrona inteligente -->
<script>
  setInterval(function () {
      const activeElement = document.activeElement;
      const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

      if (!isInteracting) {
          fetch('/tareas/parcial')
              .then(res => res.text())
              .then(html => {
                  if (html.trim() !== '') {
                      const container = document.getElementById('tablaTareasPublicadasContainer');
                      if (container) {
                            const scrollContainer = container.closest('.overflow-x-auto');
                            // 1. Guardar la posición actual del scroll horizontal
                            const scrollPos = scrollContainer ? scrollContainer.scrollLeft : 0;

                            // 2. Actualizar el contenido HTML
                            container.innerHTML = html;

                            // 3. Restaurar la posición del scroll para que no se mueva
                            if (scrollContainer) {
                                scrollContainer.scrollLeft = scrollPos;
                            }
                        }
                  }
              })
              .catch(err => console.error('Error al actualizar tareas publicadas:', err));
      }
  }, 3000);
</script>
</body>
</html>
