<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tareas del Curso | Aula Cristo Rey</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script defer th:src="@{/js/alpine.min.js}"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
<div class="flex h-screen overflow-hidden">
  <!-- Sidebar -->
  <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

  <!-- Contenedor principal -->
  <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10">

    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-800" th:text="'Tareas de ' + ${curso.nombre}">Tareas del Curso</h1>
        <p class="text-sm text-gray-500" th:text="${curso.grado != null ? curso.grado.nombre : ''}">Grado</p>
      </div>
      <a th:href="@{'/tareas/publicar/' + ${curso.id}}"
         class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium shadow-sm transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
        </svg>
        Asignar Tarea
      </a>
    </div>

    <!-- CONTENEDOR PARCIAL PARA TIEMPO REAL -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div id="tablaDocenteCursoContainer" th:fragment="tablaDocenteCursoContainer">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado de Publicación</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha Límite</th>
          </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
          <tr th:each="tarea : ${tareas}" class="hover:bg-gray-50">
            <td class="px-6 py-4">
              <div class="text-sm font-semibold text-gray-900" th:text="${tarea.titulo}">Título Tarea</div>
              <div class="text-xs text-gray-500 mt-1 line-clamp-2 max-w-xs" th:text="${tarea.descripcion}">Descripción...</div>
            </td>
            <td class="px-6 py-4 whitespace-nowrap">
                    <span th:if="${tarea.publicada}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                      Publicada
                    </span>
              <span th:unless="${tarea.publicada}" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                      Borrador
                    </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${tarea.fechaLimite != null ? #temporals.format(tarea.fechaLimite, 'dd/MM/yyyy HH:mm') : 'Sin fecha límite'}">
              10/10/2026
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(tareas)}">
            <td colspan="3" class="px-6 py-12 text-center text-gray-500">
              <div class="flex flex-col items-center">
                <svg class="h-12 w-12 text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <p>No has asignado ninguna tarea a este curso todavía.</p>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script>
  setInterval(function () {
      const activeElement = document.activeElement;
      const isInteracting = activeElement && (activeElement.tagName === 'INPUT' || activeElement.tagName === 'SELECT' || activeElement.tagName === 'TEXTAREA');

      if (!isInteracting) {
          const currentPath = window.location.pathname;
          fetch(currentPath + '/parcial')
              .then(res => res.text())
              .then(html => {
                  if (html.trim() !== '') {
                      const container = document.getElementById('tablaDocenteCursoContainer');
                      if (container) {
                            const scrollContainer = container.closest('.overflow-x-auto');
                            // 1. Guardar la posición actual del scroll horizontal
                            const scrollPos = scrollContainer ? scrollContainer.scrollLeft : 0;

                            // 2. Actualizar el contenido HTML
                            container.innerHTML = html;

                            // 3. Restaurar la posición del scroll para que no se mueva
                            if (scrollContainer) {
                                scrollContainer.scrollLeft = scrollPos;
                            }
                        }
                  }
              })
              .catch(err => console.error('Error al actualizar tareas del curso:', err));
      }
  }, 3000);
</script>
</body>
</html>
