<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publicar Tarea | Aula Cristo Rey</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script defer th:src="@{/js/alpine.min.js}"></script>
  </head>
  <body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside th:replace="~{partials/sidebar :: sidebar}"></aside>

      <!-- Contenedor principal -->
      <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden p-6 sm:p-10">
        <div class="max-w-2xl mx-auto w-full bg-white p-8 rounded-xl shadow-sm border border-gray-200">
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Publicar Tarea</h1>
            <p class="text-sm text-gray-500">Asigna una nueva actividad a tus estudiantes</p>
          </div>

          <form th:action="@{/tareas/guardar}" th:object="${tarea}" method="post" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Curso Asignado</label>
              <!-- Campo oculto para enviar el ID del curso al servidor -->
              <input type="hidden" th:field="*{curso.id}" />
              <!-- Mostrar el nombre del curso de forma estática (sólo lectura) -->
              <div class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-700" 
                   th:text="${tarea.curso.nombre + ' - ' + (tarea.curso.grado != null ? tarea.curso.grado.nombre : '')}">
              </div>
            </div>

            <div>
              <label for="titulo" class="block text-sm font-medium text-gray-700 mb-1">Título de la Tarea</label>
              <input type="text" id="titulo" th:field="*{titulo}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Ej. Ensayo sobre la Revolución Francesa" />
            </div>

            <div>
              <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción / Instrucciones</label>
              <textarea id="descripcion" th:field="*{descripcion}" rows="4" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Detalla aquí lo que los estudiantes deben realizar..."></textarea>
            </div>

            <div>
              <label for="fechaLimite" class="block text-sm font-medium text-gray-700 mb-1">Fecha Límite</label>
              <input type="datetime-local" id="fechaLimite" th:field="*{fechaLimite}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
            </div>

            <!-- AVCR-218: Publicar la tarea para que sea visible al estudiante -->
            <div class="flex items-center gap-3 p-3 bg-blue-50 border border-blue-200 rounded-lg">
              <input type="checkbox" id="publicada" th:field="*{publicada}"
                     class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
              <label for="publicada" class="text-sm font-medium text-blue-700">
                Publicar tarea (visible para los estudiantes del curso)
              </label>
            </div>

            <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
              <a th:href="@{'/tareas/curso/' + ${tarea.curso.id}}" class="px-4 py-2 bg-gray-100 text-gray-700 hover:bg-gray-200 rounded-lg font-medium transition">Cancelar</a>
              <button type="submit" class="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-medium transition">
                Publicar Tarea
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>
  </body>
</html>
